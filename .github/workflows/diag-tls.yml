# TEMPORARY diagnostic (manual only). Inspects the TLS certificate chain of the
# National Highways mobile feed host. Prints certificate metadata only.
name: Diagnose feed TLS (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Certificate chain
        run: |
          echo | openssl s_client -connect m.highwaysengland.co.uk:443 -servername m.highwaysengland.co.uk -showcerts 2>&1 | grep -E "^ *[0-9] s:|^ *i:|Verify return|verify error|NotAfter|subject=|issuer=" | head -20
          echo "--- leaf dates and SAN"
          echo | openssl s_client -connect m.highwaysengland.co.uk:443 -servername m.highwaysengland.co.uk 2>/dev/null | openssl x509 -noout -dates -ext subjectAltName -issuer 2>&1 | head -12
          echo "--- AIA"
          echo | openssl s_client -connect m.highwaysengland.co.uk:443 -servername m.highwaysengland.co.uk 2>/dev/null | openssl x509 -noout -ext authorityInfoAccess 2>&1 | head -6
          echo "--- curl"
          curl -sS -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" https://m.highwaysengland.co.uk/feeds/rss/UnplannedEvents.xml || true
          curl -sS -o /dev/null -w "%{http_code} %{content_type} %{size_download} %{redirect_url}\n" http://m.highwaysengland.co.uk/feeds/rss/UnplannedEvents.xml || true
